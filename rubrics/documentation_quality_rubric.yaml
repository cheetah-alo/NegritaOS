rubric:
  name: documentation_quality_rubric
  version: "1.0.0"
  applicable_agents: [technical_writer_agent]
  required:
    - tldr_is_first
    - objective_is_explicit
    - analytical_questions_receive_executive_answers
    - findings_are_interpreted
    - plot_reading_and_evidence_boundaries_are_explicit
    - risks_and_notes_are_visible
    - recommendations_are_actionable
    - next_actions_have_owner_or_role
    - presentation_slides_have_discourse_ready_talk_tracks
  fail_conditions:
    - orphan_sections
    - metric_dump_without_interpretation
    - plot_without_population_denominator_window_or_baseline
    - plot_caption_used_as_the_only_interpretation
    - unsupported_causal_claim
    - blocked_or_missing_value_presented_as_zero
    - slide_without_talk_track
    - unsupported_recommendations
    - missing_source_traceability_for_claims
