rubric:
  name: eda_rubric
  version: "1.0.0"
  applicable_agents: [eda_review_agent, model_review_agent]
  required:
    - data_scope_is_defined
    - missingness_is_reported
    - distributions_are_interpreted
    - target_or_outcome_context_is_explained
    - notes_are_named
    - plot_population_and_denominator_are_explicit
    - support_threshold_or_sample_size_is_visible
    - future_outcome_windows_are_defined
    - processed_vs_not_processed_states_are_separated_when_applicable
    - plot_artifact_lineage_is_traceable
  fail_conditions:
    - metric_dump_without_interpretation
    - charts_without_takeaways
    - no_data_quality_assessment
    - rates_or_lifts_without_denominator
    - future_outcomes_presented_as_causal_without_design
    - not_processed_rows_treated_as_no_signal
    - dense_unreadable_plots_used_as_evidence
