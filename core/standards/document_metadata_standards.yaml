document_metadata_standards:
  version: "1.0.0"
  description: >
    Defines mandatory metadata for all documents generated by NegritaOS agents
    for traceability, versioning, and provenance tracking.

  mandatory_metadata:
    source:
      description: "Origin of the document"
      allowed_values:
        - codex_claude: "Generated by Codex Claude AI"
        - human: "Written by human user"
        - codex_claude_human_reviewed: "Generated by AI, reviewed and edited by human"
        - human_codex_enhanced: "Written by human, enhanced by AI"
      default: codex_claude
      required: true

    document_version:
      description: "Semantic versioning of the document"
      format: "MAJOR.MINOR.PATCH"
      example: "1.0.0"
      required: true
      versioning_rules:
        major: "Breaking changes in structure or scope"
        minor: "New sections, significant content additions"
        patch: "Typo fixes, clarifications, minor edits"

    generated_date:
      description: "ISO 8601 date when document was created"
      format: "YYYY-MM-DD"
      required: true

    last_modified_date:
      description: "ISO 8601 date when document was last updated"
      format: "YYYY-MM-DD"
      required: true

    agent_id:
      description: "NegritaOS agent that generated the document"
      example: "model_review_agent"
      required: true
      allowed_values: "Any valid agent ID from agents/README.md"

    router_mode:
      description: "Router mode used to classify the request"
      allowed_values: [LP, AE, TD, MR, CR, EP, DQ, RT, BZ_HOT, BZ_MF, BZ_UVI]
      required: true

    project_id:
      description: "Project identifier from NegritaOS registry"
      example: "proj_data_analytics"
      required: true

    template_used:
      description: "Template file used to generate this document"
      example: "templates/model_review_report_template.md"
      required: true

    quality_gates_status:
      description: "Pass/Fail status of quality gates"
      allowed_values: [PASSED, PASSED_WITH_WARNINGS, FAILED]
      required: true

    quality_warnings:
      description: "List of quality gate warnings or failures"
      format: "array of strings"
      required: false
      example:
        - "Gate 'findings_are_numbered' - PASSED"
        - "Gate 'limitations_explicit' - WARNING: Only 1 limitation stated"

  deliverable_file_policy:
    description: >
      Placement, naming, and manifest requirements for deliverable artifacts
      generated or updated by NegritaOS agents. The destination is selected by
      the user; documents/ remains a compatible repository-local default.
    governed_extensions: [md, pptx, ppt, pdf, docx, doc, html]
    destination_policy: "user_selected"
    canonical_folder: "documents/"
    external_binary_default: true
    timestamp_timezone: "Europe/Madrid"
    filename_format: "<slug>__updated_YYYYMMDD_HHMMSS.<ext>"
    filename_regex: "^[a-z0-9][a-z0-9_]*__updated_[0-9]{8}_[0-9]{6}\\.(md|pptx|ppt|pdf|docx|doc|html)$"
    update_policy: "Each update creates a new timestamped version; do not overwrite prior versions."
    manifest_path: "documents/document_manifest.jsonl"
    external_manifest_policy: "optional; record path, hash, and Git policy in Brain catalog or sidecar manifest"
    excluded_source_docs:
      - "README.md"
      - ".codex/*"
      - "rules/*"
      - "skills/*"
      - "templates/*"
    manifest_record_fields:
      - document_id
      - title
      - artifact_type
      - file_path
      - created_at
      - updated_at
      - supersedes
      - project_id
      - agent_id
      - router_mode
      - source_paths
      - quality_gates_status

  source_document_structure_policy:
    description: >
      Minimum structure for source documentation generated or substantially
      updated by NegritaOS agents. Deliverables still use the stricter
      deliverable_file_policy above.
    governed_paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/*"
      - ".codex/*"
      - "rules/*"
      - "skills/*"
      - "templates/*"
    required_sections:
      - title
      - purpose
      - audience_and_scope
      - source_of_truth_or_provenance
      - current_behavior_or_contract
      - procedure_examples_schema_or_commands
      - quality_gates_or_validation
      - ownership_and_update_trigger
      - open_questions_or_limitations_when_applicable
    minimum_for_small_docs:
      - purpose
      - scope
      - source_of_truth
      - current_behavior
      - validation
    template_policy: "Use the closest existing template under templates/ before inventing a new structure."
    enforcement: "Reject unstructured documentation that lacks purpose, scope, source of truth, current behavior, or validation."

  notion_specific_metadata:
    description: >
      When exporting to Notion, these fields should be mapped to Notion database properties.

    notion_properties:
      Source:
        type: "Select"
        options: ["Codex Claude", "Human", "Codex+Human Reviewed", "Human+Codex Enhanced"]

      Version:
        type: "Text"
        format: "1.0.0"

      Generated Date:
        type: "Date"

      Last Modified:
        type: "Date"

      Agent:
        type: "Select"
        options: "Populate from agent registry"

      Router Mode:
        type: "Select"
        options: ["LP", "AE", "TD", "MR", "CR", "EP", "DQ", "RT", "BZ_HOT", "BZ_MF", "BZ_UVI"]

      Project:
        type: "Select"
        options: "Populate from project registry"

      Quality Status:
        type: "Select"
        options: ["✅ Passed", "⚠️ Warnings", "❌ Failed"]

      Quality Warnings:
        type: "Multi-select"

  markdown_header_template:
    description: "YAML frontmatter to include in every markdown document"
    format: |
      ---
      metadata:
        source: codex_claude | human | codex_claude_human_reviewed | human_codex_enhanced
        document_version: "1.0.0"
        generated_date: "YYYY-MM-DD"
        last_modified_date: "YYYY-MM-DD"
        agent_id: "agent_name"
        router_mode: "MODE_ID"
        project_id: "project_name"
        template_used: "templates/template_name.md"
        quality_gates_status: PASSED | PASSED_WITH_WARNINGS | FAILED
        quality_warnings:
          - "warning 1"
          - "warning 2"
      ---

  enforcement_policy:
    missing_metadata:
      action: "Reject document generation"
      message: "All mandatory metadata fields must be present"

    invalid_metadata:
      action: "Reject document generation"
      message: "Metadata values must be from allowed_values list"

    notion_export:
      action: "Include metadata section at top of document as callout block"
      format: |
        > 📋 **Document Metadata**
        > - **Source:** Codex Claude
        > - **Version:** 1.0.0
        > - **Generated:** 2026-05-19
        > - **Agent:** model_review_agent
        > - **Mode:** MR
        > - **Project:** proj_data_analytics
        > - **Quality Status:** ✅ Passed

    deliverable_creation:
      action: "Require an explicit destination; accept repository or external paths"
      message: "Select the deliverable destination before writing. Use an __updated_YYYYMMDD_HHMMSS timestamp; external binaries are not tracked by default."

  examples:
    model_review_report:
      metadata:
        source: codex_claude
        document_version: "1.0.0"
        generated_date: "2026-05-19"
        last_modified_date: "2026-05-19"
        agent_id: model_review_agent
        router_mode: MR
        project_id: proj_data_analytics
        template_used: templates/model_review_report_template.md
        quality_gates_status: PASSED
        quality_warnings: []

    tfm_evaluation_human_reviewed:
      metadata:
        source: codex_claude_human_reviewed
        document_version: "1.1.0"
        generated_date: "2026-05-15"
        last_modified_date: "2026-05-19"
        agent_id: uvi_master_ia_agent
        router_mode: AE
        project_id: uvi_master_ia
        template_used: templates/uvi_tfm_evaluation_template.md
        quality_gates_status: PASSED_WITH_WARNINGS
        quality_warnings:
          - "Gate 'feedback_actionable' - WARNING: 1 feedback item lacks specific action"

    technical_doc_notion:
      metadata:
        source: codex_claude
        document_version: "2.0.0"
        generated_date: "2026-05-10"
        last_modified_date: "2026-05-19"
        agent_id: technical_writer_agent
        router_mode: TD
        project_id: proj_data_analytics
        template_used: templates/analytical_report_template.md
        quality_gates_status: PASSED
        quality_warnings: []
      notion_callout: |
        > 📋 **Document Metadata**
        > - **Source:** Codex Claude
        > - **Version:** 2.0.0
        > - **Generated:** 2026-05-10
        > - **Last Modified:** 2026-05-19
        > - **Agent:** technical_writer_agent (TD mode)
        > - **Project:** proj_data_analytics
        > - **Quality Status:** ✅ Passed
