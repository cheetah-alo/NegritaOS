negrita_brain:
  schema_version: 2
  timezone: Europe/Madrid
  contract_state_required_for_mutation: READY
  memory:
    schema_version: 2
    owner: negrita_brain
    persistence: relevant
    legacy: preserve_and_catalog
    index_owner: durable_memory
    active_pointer_strategy: provider_session
    canonical_home: "~/.negritaos/memory/projects/<project_id>"
    durable_paths:
      index: index.md
      sessions: sessions
      observations: observations.jsonl
      decisions: decisions/ledger.jsonl
      tasks: tasks
    runtime_paths:
      sessions: runtime/sessions
      active: runtime/active/<provider>/<session_key_hash>.json
    session_key_sources:
      codex: CODEX_THREAD_ID
      claude: hook.session_id
  default_mode_map:
    astra_review: ASTRA
    astral_review: ASTRA
    planning: LP
    tracking_hours: HOURS
    hours_tracking: HOURS
    workload_estimate: HOURS
    overtime_estimate: HOURS
    model_governance_card: MCARD
    model_card: MCARD
    model_tracking: MCARD
    rule_model_card: MCARD
    architecture: LP
    documentation: TD
    writeup: TD
    implementation: CR
    write: CR
    code_review: CR
    pull_request_review: PRR
    pr_risk_review: PRR
    merge_gate: PRR
    lifecycle_qa: LQA
    adversarial_lifecycle_qa: LQA
    flow_qa: LQA
    quality_bar_gauntlet: QG
    gauntlet: QG
    benchmark_review: QG
    review: CR
    plot_analysis: PA
    chart_interpretation: PA
    deck: EP
    presentation: EP
    eda: MR
    model_review: MR
    data_quality_audit: DQ
    research: RT
    academic_review: AE
  safe_logging:
    format: jsonl
    allow:
      - event_id
      - session_id
      - occurred_at
      - event_kind
      - status
      - provider
      - tool
      - action
      - file_path
      - decision_ids
      - durable_ref
    prohibit:
      - prompts
      - responses
      - file_contents
      - tool_outputs
      - secrets
  external_app_financial_control:
    enforcement: strict
    default_decision: BLOCK
    blocked_state: BLOCKED_FINANCIAL_AUTHORIZATION
    applies_to: [mcp, app_connector, browser, cli, api, sdk, cloud_console]
    explicit_user_authorization_required: true
    authorization_scope: one_specific_operation
    authorization_expires_after_operation: true
    never_infer_authorization_from:
      - account_connection
      - authenticated_session
      - request_to_use_an_app
      - prior_authorization
      - existing_subscription
      - available_payment_method
    protected_actions:
      - change_plan_tier_or_subscription
      - start_or_convert_a_paid_trial
      - purchase_credits_tokens_addons_domains_or_services
      - add_paid_seats_or_licenses
      - create_or_scale_billable_resources
      - enable_metered_features_with_incremental_cost
      - change_billing_or_payment_method
      - accept_a_quote_contract_or_recurring_commitment
      - perform_an_operation_known_or_likely_to_incur_incremental_cost
    required_authorization_context:
      - provider
      - account_or_workspace
      - exact_operation
      - known_price_currency_and_recurrence
      - effective_date_or_billing_effect
    unknown_cost_decision: BLOCK
    unknown_cost_action: ask_user_before_proceeding
  browser_profile_routing:
    enforcement: strict
    config: core/orchestration/browser_profile_routing.yaml
    launcher: scripts/open_governed_browser.py
    required_for: authenticated_browser_work
    blocked_state: BLOCKED_BROWSER_PROFILE_RESOLUTION
    no_cross_profile_fallback: true
    in_app_browser_policy: anonymous_or_non_profile_work_only
  model_escalation:
    enforcement: strict
    config: core/orchestration/model_escalation_policy.yaml
    rule: rules/global/model_escalation_rule.md
    default_tier: luna_medium
    blocked_state: BLOCKED_MODEL_ROUTING
    independent_review_fail_closed: true
  enforcement:
    code:
      read: allow
      mutation_without_ready_contract: block
      commit_without_ready_contract: block
      noncompliant_deliverable: block
    workspace:
      read: allow
      mutation_without_ready_contract: warn
      commit_without_ready_contract: warn
      noncompliant_deliverable: warn
    evidence:
      read: allow
      mutation_without_ready_contract: warn
      commit_without_ready_contract: warn
      noncompliant_deliverable: warn
      immutable_existing_artifacts: true
  artifact_route:
    selection: user_selected
    directory: documents
    manifest: documents/document_manifest.jsonl
    manifest_mode: optional_for_external
    require_explicit_path_for: [md, pptx, ppt, pdf, docx, doc, html]
    default_git_policy:
      md: tracked_candidate
      pptx: external
      ppt: external
      pdf: external
      docx: external
      doc: external
      html: external
    filename_pattern: "<slug>__updated_YYYYMMDD_HHMMSS.<ext>"
    timezone: Europe/Madrid
  quality_gates:
    code:
      - tests
      - coverage
      - config_resolution
      - registry_paths
      - alignment
      - document_control
      - secret_scan
      - git_diff_check
    workspace:
      - config_resolution
      - document_control
      - alignment
    evidence:
      - config_resolution
      - legacy_catalog
      - no_move_no_overwrite
  decisions:
    initial_status: CANDIDATE
    accepted_status: ACCEPTED
    correction_status: SUPERSEDED
    stale_candidate_days: 30
    adr_kinds: [architecture, contract]
