metaagent_router:
  version: "1.0.0"
  description: >
    Classification and dispatch layer for NegritaOS. Receives any incoming request,
    classifies it into one or more operational modes, selects the appropriate agent(s),
    and defines the execution sequence for mixed-mode requests.
    No request enters an agent without passing through this router.

  classification_policy:
    ambiguity_handling: "classify_to_closest_mode_and_state_assumption"
    multi_mode_threshold: "if_two_or_more_modes_detected_use_pipeline"
    fallback_mode: "technical_documentation"

  modes:

    leadership_planning:
      id: LP
      label: "Leadership Planning"
      agent: team_lead_ds_agent
      specialist_agents:
        jira_import_operations:
          agent: jira_import_agent
          when:
            - preparing Jira bulk-import CSV files
            - creating Jira subtasks under existing parent tasks
            - repairing failed Jira imports
            - parsing Jira validation or import logs
            - producing rescue CSV files and audit evidence
      trigger_signals:
        - roadmap
        - sprint planning
        - task breakdown
        - jira epic
        - jira bulk import
        - jira csv import
        - jira subtask import
        - jira rescue import
        - invalid Parent selection
        - team escalation
        - OKR alignment
        - delivery risk
        - blocker identification
        - meeting to tasks
        - requirement clarification
        - quarterly planning
        - weekly summary
      input_types:
        - meeting notes
        - verbal description of initiative
        - problem statement
        - slack thread
      output_types:
        - requirement_breakdown
        - jira_epic
        - sprint_plan
        - escalation_register
        - weekly_summary
        - four_month_roadmap

    academic_evaluation:
      id: AE
      label: "Academic Evaluation"
      agent: tfm_evaluator_agent
      trigger_signals:
        - thesis review
        - thesis PDF review
        - TFM evaluation
        - TFM reviewer
        - benchmark calibration
        - final academic review
        - master thesis
        - research proposal
        - academic defense
        - tribunal report
        - student feedback
        - methodology review
        - objective alignment
        - academic score
        - publication readiness
      input_types:
        - thesis document
        - proposal draft
        - milestone document
        - abstract
      output_types:
        - section_by_section_review
        - tribunal_report
        - improvement_plan
        - scorecard

    plot_analysis:
      id: PA
      label: "Evidence-First Plot Analysis"
      agent: plot_analysis_agent
      trigger_signals:
        - plot analysis
        - analyze this plot
        - interpret this chart
        - interpret these plots
        - compare these plots
        - chart evidence
        - chart interpretation
        - visualization interpretation
        - dashboard plot narrative
        - explain this figure
        - plot takeaway
        - what does this plot tell us
        - what does this chart not prove
      input_types:
        - plot image
        - chart
        - dashboard screenshot
        - EDA output
        - model diagnostic plot
        - report draft with plots
        - deck with charts
      output_types:
        - plot_interpretation
        - plot_comparison
        - evidence_boundary_note
        - report_plot_narrative
        - deck_plot_takeaway

    technical_documentation:
      id: TD
      label: "Technical Documentation"
      agent: technical_writer_agent
      specialist_agents:
        evidence_first_plot_analysis:
          agent: plot_analysis_agent
          when:
            - writing about plots in Markdown, DOCX, or PDF
            - interpreting charts in a technical report
            - converting plot evidence into report narrative
            - documenting evidence boundaries for a figure
      trigger_signals:
        - write a notion doc
        - confluence page
        - technical memo
        - document this analysis
        - write up findings
        - report for the team
        - DOCX report
        - PDF report
        - technical EDA report
        - report with plots
        - plot-backed report
        - chart narrative for report
        - IBC technical EDA report
        - source-readiness memo
        - join-readiness memo
        - architecture note
        - postmortem
        - decision record
      input_types:
        - analytical results
        - raw notes
        - plots or charts
        - verbal summary
      output_types:
        - notion_doc
        - confluence_doc
        - docx_report
        - pdf_report
        - technical_memo
        - executive_brief

    ml_eda_model_review:
      id: MR
      label: "ML / EDA / Model Review"
      agent: model_review_agent
      specialist_agents:
        evidence_first_plot_analysis:
          agent: plot_analysis_agent
          when:
            - interpreting EDA plots
            - interpreting model diagnostic plots
            - interpreting SHAP, lift, confusion matrix, or feature importance visuals
            - comparing plots for support, contradiction, or qualification
      trigger_signals:
        - review this model
        - EDA report
        - EDA plot interpretation
        - feature importance
        - model performance
        - SHAP analysis
        - leakage check
        - class imbalance
        - XGBoost
        - AutoGluon
        - EBM
        - LightGBM
        - churn model
        - classification report
        - confusion matrix
        - lift chart
        - feature importance plot
        - diagnostic plot
        - operational rules
        - segmentation
        - clustering review
      input_types:
        - model outputs
        - EDA notebook
        - classification report
        - feature importance table
        - SHAP values
      output_types:
        - notion_report
        - technical_review
        - executive_model_summary
        - operational_recommendations

    code_repository_work:
      id: CR
      label: "Code / Repository Work"
      agent: code_review_agent
      specialist_agents:
        pull_request_risk_review:
          agent: pull_request_reviewer_agent
          when:
            - reviewing a pull request or merge request
            - evaluating PR risk before approval
            - checking merge gate readiness
            - assessing auto-approval eligibility in shadow mode
            - reviewing GitHub PR checks or CI status
        software_architecture:
          agent: software_architect_agent
          when:
            - starting a new repository
            - designing repo structure
            - defining modular architecture
            - setting quality gates before implementation
            - designing dashboard architecture
            - defining dashboard backend/frontend boundaries
            - selecting a data source adapter
            - defining BigQuery or PostgreSQL source routing
      trigger_signals:
        - review this code
        - PR review
        - PR risk review
        - pull request review
        - merge gate
        - auto approve PR
        - GitHub PR checks
        - software architect
        - architecture plan
        - repo structure
        - repository blueprint
        - start a repo
        - new repository
        - modular architecture
        - maintainable structure
        - quality score
        - code quality 80
        - refactor
        - BigQuery SQL
        - Jinja BigQuery
        - Jinja SQL template
        - dynamic SQL template
        - Python script
        - pipeline review
        - logging review
        - config management
        - reproducibility
        - MLflow
        - DAG review
        - data pipeline
        - technical debt
        - anti-patterns
        - dashboard architecture
        - dashboard source structure
        - FastAPI dashboard
        - Next.js dashboard
        - PostgreSQL adapter
        - data source adapter
      input_types:
        - Python file
        - SQL query
        - repository link
        - pull request
        - merge request
        - branch diff
        - notebook
        - DAG definition
      output_types:
        - code_review_report
        - pr_risk_review
        - merge_gate_assessment
        - repository_blueprint
        - architecture_review
        - modularization_plan
        - quality_gate_plan
        - refactor_plan
        - pull_request_comments
        - technical_debt_register

    pull_request_risk_review:
      id: PRR
      label: "Pull Request Risk Review"
      agent: pull_request_reviewer_agent
      trigger_signals:
        - PR risk review
        - pull request review
        - merge gate
        - auto approve PR
        - GitHub PR checks
        - review this PR
        - review this pull request
        - PR approval
        - merge readiness
      input_types:
        - pull request
        - merge request
        - pr diff
        - branch diff
        - github pr
      output_types:
        - pr_risk_review
        - merge_gate_assessment
        - pull_request_comments
        - changes_required_summary

    executive_presentation:
      id: EP
      label: "Executive Presentation"
      agent: presentation_agent
      specialist_agents:
        evidence_first_plot_analysis:
          agent: plot_analysis_agent
          when:
            - writing slide takeaways from plots
            - explaining charts in speaker notes
            - comparing charts across an analytical deck
            - checking evidence boundaries for deck visuals
      trigger_signals:
        - make a deck
        - presentation slides
        - executive slides
        - leadership summary
        - board presentation
        - storytelling structure
        - top-down narrative
        - one-pager
        - stakeholder brief
        - plot takeaway for deck
        - chart-backed slide
        - deck with charts
      input_types:
        - analytical report
        - raw findings
        - model review output
        - research synthesis
      output_types:
        - slide_outline
        - full_slide_content
        - speaker_notes
        - executive_summary

    data_quality_escalation:
      id: DQ
      label: "Data Quality / Escalation"
      agent: data_quality_sentinel_agent
      trigger_signals:
        - data quality issue
        - null values
        - schema drift
        - KPI anomaly
        - pipeline failure
        - data incident
        - escalate to data team
        - root cause analysis
        - monitoring alert
        - data SLA breach
      input_types:
        - anomaly report
        - pipeline logs
        - KPI dashboard anomaly
        - schema diff
      output_types:
        - dq_incident
        - escalation_note
        - root_cause_report
        - monitoring_checklist

    research_tfm_generation:
      id: RT
      label: "Research / TFM Topic Generation"
      agent: ai_trend_radar_agent
      specialist_agents:
        tfm_research_advising:
          agent: tfm_research_advisor_agent
          when:
            - new TFM titles
            - TFM research advisor
            - public dataset for thesis
            - dataset license for TFM
            - publication-oriented TFM
            - proposal differentiation
      trigger_signals:
        - TFM topic ideas
        - new TFM titles
        - TFM research advisor
        - research opportunities
        - public dataset for thesis
        - dataset license for TFM
        - publication-oriented TFM
        - AI trends
        - blockchain AI research
        - paper synthesis
        - hype vs reality
        - technology radar
        - what's new in ML
        - research gap
        - proposal differentiation
        - frontier models
        - governance trends
        - LLM research
      input_types:
        - topic description
        - domain of interest
        - research question
        - paper reference
      output_types:
        - weekly_digest
        - paper_list
        - topic_opportunities
        - tfm_topic_shortlist
        - tfm_research_opportunity
        - dataset_access_audit
        - strategic_brief

  mixed_mode_pipeline:
    description: >
      When a request triggers two or more modes, apply agents in the following
      canonical sequence. Each agent receives the output of the previous as input.
      Skip agents whose mode was not triggered.
    sequence:
      - step: 1
        role: reviewer
        modes_applicable: [MR, CR, AE]
        action: "Analyze and critique the input material. Surface issues, risks, assumptions."
      - step: 2
        role: structurer
        modes_applicable: [LP, TD, RT]
        action: "Organize findings into a structured skeleton. Define sections, hierarchy, key points."
      - step: 3
        role: writer
        modes_applicable: [TD, EP]
        action: "Draft full content from structured skeleton. Apply output standards and templates."
      - step: 4
        role: executive_summarizer
        modes_applicable: [EP]
        action: "Compress written content into executive narrative. Top-down, decision-oriented."
      - step: 5
        role: task_generator
        modes_applicable: [LP, DQ]
        action: "Extract actionable next steps. Assign owners where known. Flag blockers."

    pipeline_examples:
      - label: "Model Review → Notion Doc → Executive Slides"
        modes: [MR, TD, EP]
        sequence: [reviewer, writer, executive_summarizer]
      - label: "Code Review → Technical Memo → Task List"
        modes: [CR, TD, LP]
        sequence: [reviewer, structurer, writer, task_generator]
      - label: "Paper Synthesis → TFM Topic → Research Brief"
        modes: [RT, AE]
        sequence: [structurer, writer]
      - label: "Data Quality Incident → Escalation Note → DQ Tasks"
        modes: [DQ, LP]
        sequence: [reviewer, structurer, task_generator]

  # ─── BUSINESS LAYER MODES ───────────────────────────────────────────────────

  business_modes:

    moneyflow:
      id: BZ_MF
      label: "MoneyFlow Analytics"
      agent: moneyflow_analyst_agent
      trigger_signals:
        - MoneyFlow
        - revenue analysis
        - ARPU
        - MRR
        - billing anomaly
        - revenue at risk
        - plan migration
        - revenue forecast
        - plan mix
        - upsell revenue
        - revenue por segmento
        - análisis de ingresos
        - facturación
      input_types:
        - billing_data_summary
        - arpu_table
        - revenue_kpi_observation
        - plan_migration_data
      output_types:
        - revenue_analysis_report
        - arpu_segmentation_report
        - billing_anomaly_incident
        - forecast_brief
        - executive_revenue_summary

    hot_operations:
      id: BZ_HOT
      label: "Hot / HotMobile Operations"
      agent: hot_operations_agent
      trigger_signals:
        - Hot
        - HotMobile
        - churn Hot
        - churn HotMobile
        - cliente Hot
        - segmentación Hot
        - NPS Hot
        - modelo de churn
        - propensión
        - retención de clientes
        - análisis de cliente telecom
        - entregable cliente
        - informe cliente
        - presentación Hot
      input_types:
        - churn_model_output
        - segmentation_results
        - nps_data
        - client_request
        - model_performance_metrics
      output_types:
        - churn_model_review
        - segmentation_analysis
        - nps_report
        - operational_rules_brief
        - client_executive_summary
        - client_deliverable

    uvi_master_ia:
      id: BZ_UVI
      label: "UVI Máster IA — Evaluación y Tutoría"
      agent: uvi_master_ia_agent
      trigger_signals:
        - UVI
        - Universidad Internacional de Valencia
        - Máster IA
        - TFM UVI
        - evaluar TFM
        - nota TFM
        - feedback estudiante
        - propuesta TFM UVI
        - tutor TFM
        - tribunal UVI
        - calificación TFM
      input_types:
        - documento_tfm
        - propuesta_tfm
        - abstract
        - milestone_intermedio
      output_types:
        - evaluacion_tfm_completa
        - feedback_estudiante
        - informe_tribunal_uvi
        - nota_y_justificacion
        - plan_mejora_tfm

  # ─── ROUTING RESOLUTION ──────────────────────────────────────────────────────

  routing_resolution:
    priority_override:
      description: >
        If the user explicitly names an agent or mode, bypass classification
        and route directly. Explicit routing always wins.
      syntax: "@agent:<agent_id> <request>"
      examples:
        - "@agent:MR review this churn model output"
        - "@agent:AE evaluate this thesis abstract"
        - "@agent:LP convert this meeting to Jira tasks"

    confidence_threshold:
      description: >
        If signal match is weak (fewer than 2 trigger signals matched),
        state the assumed mode and confirm before proceeding.
      threshold: 2
      action_below_threshold: "state_assumed_mode_and_ask_to_confirm"
