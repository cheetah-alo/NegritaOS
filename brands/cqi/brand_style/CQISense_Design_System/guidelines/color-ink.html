<!-- @dsCard group="Colors" viewport="700x150" name="Charcoal / text" subtitle="Cool grays for text and deep surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);}
  .sw-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:118px;}
  .sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-hair);}
  .sw .nm{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:7px;}
  .sw .tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;}
</style></head><body><div class="sw-grid">
  <div class="sw"><div class="chip" style="background:var(--gray-900);border:none;"></div><div class="nm">gray-900</div><div class="tk">--black</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-800);border:none;"></div><div class="nm">gray-800</div><div class="tk">--text-strong</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-700);border:none;"></div><div class="nm">gray-700</div><div class="tk">--gray-700</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-600);border:none;"></div><div class="nm">gray-600</div><div class="tk">--text-muted</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-500);"></div><div class="nm">gray-500</div><div class="tk">--text-subtle</div></div>
</div></body></html>
