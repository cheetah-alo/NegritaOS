<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);}
  .sw-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:118px;}
  .sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-hair);}
  .sw .nm{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:7px;}
  .sw .tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .rowflex{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
</style></head><body><div class="sw-grid"><div class="sw"><div class="chip" style="background:var(--cat-1);"></div><div class="nm">cat-1</div><div class="tk">--cat-1</div></div><div class="sw"><div class="chip" style="background:var(--cat-2);"></div><div class="nm">cat-2</div><div class="tk">--cat-2</div></div><div class="sw"><div class="chip" style="background:var(--cat-3);"></div><div class="nm">cat-3</div><div class="tk">--cat-3</div></div><div class="sw"><div class="chip" style="background:var(--cat-4);"></div><div class="nm">cat-4</div><div class="tk">--cat-4</div></div><div class="sw"><div class="chip" style="background:var(--cat-5);"></div><div class="nm">cat-5</div><div class="tk">--cat-5</div></div><div class="sw"><div class="chip" style="background:var(--cat-6);"></div><div class="nm">cat-6</div><div class="tk">--cat-6</div></div><div class="sw"><div class="chip" style="background:var(--cat-7);"></div><div class="nm">cat-7</div><div class="tk">--cat-7</div></div><div class="sw"><div class="chip" style="background:var(--cat-8);"></div><div class="nm">cat-8</div><div class="tk">--cat-8</div></div></div></body></html>
