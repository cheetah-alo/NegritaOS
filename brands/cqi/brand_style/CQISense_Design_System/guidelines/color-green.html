<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);}
  .sw-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:118px;}
  .sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-hair);}
  .sw .nm{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:7px;}
  .sw .tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .rowflex{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
</style></head><body><div class="sw-grid"><div class="sw"><div class="chip" style="background:var(--green-900);"></div><div class="nm">green-900</div><div class="tk">--green-900</div></div><div class="sw"><div class="chip" style="background:var(--green-800);"></div><div class="nm">green-800</div><div class="tk">--green-800</div></div><div class="sw"><div class="chip" style="background:var(--green-700);"></div><div class="nm">green-700</div><div class="tk">--green-700</div></div><div class="sw"><div class="chip" style="background:var(--green-600);"></div><div class="nm">green-600 ·brand</div><div class="tk">--green-600</div></div><div class="sw"><div class="chip" style="background:var(--green-500);"></div><div class="nm">green-500</div><div class="tk">--green-500</div></div><div class="sw"><div class="chip" style="background:var(--green-300);"></div><div class="nm">green-300</div><div class="tk">--green-300</div></div><div class="sw"><div class="chip" style="background:var(--green-100);"></div><div class="nm">green-100</div><div class="tk">--green-100</div></div></div></body></html>
