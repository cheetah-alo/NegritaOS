<!-- @dsCard group="Colors" viewport="700x150" name="Score families" subtitle="Repair (blue-side) · Risk (red-side) · Operational" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);}
  .sw-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:118px;}
  .sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-hair);}
  .sw .nm{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:7px;}
  .sw .tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .rowflex{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
</style></head><body><div class="sw-grid"><div class="sw"><div class="chip" style="background:var(--repair);"></div><div class="nm">Repair</div><div class="tk">--repair</div></div><div class="sw"><div class="chip" style="background:var(--repair-soft);"></div><div class="nm">Repair soft</div><div class="tk">--repair-soft</div></div><div class="sw"><div class="chip" style="background:var(--risk);"></div><div class="nm">Risk</div><div class="tk">--risk</div></div><div class="sw"><div class="chip" style="background:var(--risk-soft);"></div><div class="nm">Risk soft</div><div class="tk">--risk-soft</div></div><div class="sw"><div class="chip" style="background:var(--operational);"></div><div class="nm">Operational</div><div class="tk">--operational</div></div><div class="sw"><div class="chip" style="background:var(--relief);"></div><div class="nm">Relief</div><div class="tk">--relief</div></div><div class="sw"><div class="chip" style="background:var(--overlay-strain);"></div><div class="nm">Strain overlay</div><div class="tk">--overlay-strain</div></div></div></body></html>
