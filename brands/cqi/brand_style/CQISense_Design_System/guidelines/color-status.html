<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success · Warning · Danger · Info · Heat" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);}
  .sw-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:118px;}
  .sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-hair);}
  .sw .nm{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:7px;}
  .sw .tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .rowflex{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
</style></head><body><div class="sw-grid"><div class="sw"><div class="chip" style="background:var(--success);"></div><div class="nm">Success</div><div class="tk">--success</div></div><div class="sw"><div class="chip" style="background:var(--warning);"></div><div class="nm">Warning</div><div class="tk">--warning</div></div><div class="sw"><div class="chip" style="background:var(--danger);"></div><div class="nm">Danger</div><div class="tk">--danger</div></div><div class="sw"><div class="chip" style="background:var(--info);"></div><div class="nm">Info</div><div class="tk">--info</div></div><div class="sw"><div class="chip" style="background:var(--heat);"></div><div class="nm">Heat (Hot Orange)</div><div class="tk">--heat</div></div></div></body></html>
