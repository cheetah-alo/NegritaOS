<!-- @dsCard group="Colors" viewport="700x150" name="Archetype palette" subtitle="Calm → caution → exit (A · B · C · D · D2 · E · F)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);}
  .sw-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:118px;}
  .sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-hair);}
  .sw .nm{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:7px;}
  .sw .tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .rowflex{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
</style></head><body><div class="sw-grid"><div class="sw"><div class="chip" style="background:var(--arch-a);"></div><div class="nm">A Resolved</div><div class="tk">--arch-a</div></div><div class="sw"><div class="chip" style="background:var(--arch-b);"></div><div class="nm">B Op. Loop</div><div class="tk">--arch-b</div></div><div class="sw"><div class="chip" style="background:var(--arch-c);"></div><div class="nm">C Repair</div><div class="tk">--arch-c</div></div><div class="sw"><div class="chip" style="background:var(--arch-d);"></div><div class="nm">D Exit</div><div class="tk">--arch-d</div></div><div class="sw"><div class="chip" style="background:var(--arch-d2);"></div><div class="nm">D2 Escalation</div><div class="tk">--arch-d2</div></div><div class="sw"><div class="chip" style="background:var(--arch-e);"></div><div class="nm">E Silent</div><div class="tk">--arch-e</div></div><div class="sw"><div class="chip" style="background:var(--arch-f);"></div><div class="nm">F Uncertain</div><div class="tk">--arch-f</div></div></div></body></html>
