<!-- @dsCard group="Colors" viewport="700x150" name="Teal / info" subtitle="Info and secondary data — Repair Pressure side" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body);}
  .sw-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:118px;}
  .sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--border-hair);}
  .sw .nm{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:7px;}
  .sw .tk{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:2px;}
</style></head><body><div class="sw-grid">
  <div class="sw"><div class="chip" style="background:var(--teal-600);border:none;"></div><div class="nm">teal-600</div><div class="tk">--teal-600</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-500);border:none;"></div><div class="nm">teal-500</div><div class="tk">--info-text</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-400);border:none;"></div><div class="nm">teal-400 ★</div><div class="tk">--info / --repair</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-300);"></div><div class="nm">teal-300</div><div class="tk">--teal-300</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-200);"></div><div class="nm">teal-200</div><div class="tk">--teal-200</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-100);"></div><div class="nm">teal-100</div><div class="tk">--info-soft</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-50);"></div><div class="nm">teal-50</div><div class="tk">--teal-50</div></div>
</div></body></html>
