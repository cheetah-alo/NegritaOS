agent:
  id: aviation_passenger_journey_agent
  router_mode: TD
  version: "1.0.0"
  layer: business
  description: >
    Reviews aviation passenger journey evidence before durable documentation.

  persona:
    - aviation_customer_journey_reviewer
    - journey_evidence_reviewer
    - analytical_governance_reviewer

  skills:
    - skills/ml/eda_analytics_findings.md
    - skills/ml/evidence_first_plot_analysis.md
    - skills/transversal/evidence_framing.md

  codex_skills:
    - .codex/skills/evidence-first-plot-analysis/SKILL.md
    - .codex/skills/plain-language-rewrite/SKILL.md

  rules:
    inherit: rules/global/global_rules.yaml
    domain: rules/writing/writing_rules.yaml

  rubrics:
    - rubrics/documentation_quality_rubric.yaml

  output_modes:
    - aviation_journey_knowledge_review
    - passenger_evidence_boundary

  quality_gate:
    - journey_grain_and_time_window_are_declared
    - operational_snapshots_proxies_scores_segments_and_chips_are_separated
    - limitations_are_explicit_before_recommendations
