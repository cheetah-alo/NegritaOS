catalog:
  name: negritaos-federated-skills
  version: "1.0.0"
  purpose: >
    Canonical mapping from imported Engram and Nate skills plus native
    NegritaOS skills to project profiles, scopes, dependencies, and activation
    policy.
  source_policy:
    raw_sources_are_reference_only: true
    canonical_activation_root: .codex/skills
    native_agent_skill_roots: [skills/engineering, skills/academic]
    do_not_copy_full_codex_into_sibling_repos: true

profiles:
  academic-tfm-research:
    description: Research and proposal of differentiated, data-backed TFM titles.
    skills:
      - tfm-research-advisor
  academic-tfm-review:
    description: Final TFM review with deterministic scoring and local benchmark calibration.
    skills:
      - tfm-academic-reviewer
  analytical-eda:
    description: Provider-neutral governance for new or migrated exploratory analyses.
    skills:
      - analytical-eda-governance
      - data-contracts
      - data-loading
      - testing-coverage
      - docs-alignment
  elal-eda-governance:
    description: Opt-in ELAL passenger-journey EDA semantics and evidence states.
    skills:
      - analytical-eda-governance
      - bigquery-analysis-governance
      - elal-eda-governance
  analytical-dashboard:
    description: Modular data-backed dashboard architecture and delivery.
    skills:
      - analytical-dashboard-architecture
      - data-source-adapters
      - dashboard-architecture
      - frontend-web
      - api-design
      - data-contracts
      - docs-alignment
      - playwright
      - commit-hygiene
      - pr-review-deep
      - sdd-flow
      - branch-pr
      - testing-coverage
  fastapi-nextjs:
    description: FastAPI backend and Next.js frontend boundaries.
    skills:
      - backend-service
      - api-design
      - frontend-web
      - nextjs-15
      - react-19
      - typescript
      - playwright
  data-source-bigquery:
    description: Read-only or governed BigQuery source adapter profile.
    data_source:
      provider: bigquery
      dialects: [google_standard_sql]
    skills:
      - data-source-adapters
      - bigquery-analysis-governance
      - jinja-bigquery
      - data-contracts
      - data-loading
  data-source-postgresql:
    description: PostgreSQL source adapter profile using logical API contracts.
    data_source:
      provider: postgresql
      dialects: [postgresql]
    skills:
      - data-source-adapters
      - data-contracts
      - data-loading
  visual-delivery:
    description: Explicitly requested visual, diagram, or video-to-website work.
    skills:
      - nate-frontend-design
      - nate-excalidraw-diagram
      - nate-excalidraw-visuals
      - nate-video-to-website
  rule-model-documentation:
    description: CQI-style documentation for deterministic rule-based models and rules engines.
    skills:
      - rule-model-documentation
  cqi-analytical-pptx:
    description: CQI analytical PowerPoint delivery, QA, release, and podcast contracts.
    skills:
      - analytics-storytelling-deck
      - cqi-analytical-pptx
      - document-control
  cqi-analytical-docx-pdf:
    description: CQI analytical Word/PDF delivery, APA figure/table standards, render QA, and document-control governance.
    skills:
      - cqi-analytical-docx-pdf
      - document-control
      - docs-alignment
  ibc-technical-eda-presentation:
    description: IBC technical EDA and ML-readiness decks layered on CQI PPTX governance.
    skills:
      - analytics-storytelling-deck
      - cqi-analytical-pptx
      - ibc-technical-eda-presentation
      - document-control
  ibc-technical-eda-report:
    description: IBC technical EDA DOCX/PDF reports layered on CQI document governance and IBC source-readiness guardrails.
    skills:
      - cqi-analytical-docx-pdf
      - ibc-technical-eda-report
      - document-control
      - analytical-eda-governance
      - data-contracts
      - docs-alignment
  elal-analytical-deck:
    description: ELAL passenger-journey analytical deck profile layered on CQI PPTX governance.
    skills:
      - analytics-storytelling-deck
      - cqi-analytical-pptx
      - elal-eda-governance

