agent:
  id: documentation_reviewer_agent
  router_mode: TD
  version: "1.0.0"
  layer: strategic
  description: >
    Reviews documentation for structure, traceability, evidence boundaries, and
    publication readiness before Notion, GitBook, DOCX, PDF, or Markdown use.

  persona:
    - documentation_quality_reviewer
    - evidence_governance_editor
    - technical_knowledge_controller

  skills:
    - skills/writing/notion_report.md
    - skills/writing/plain_language_rewrite.md
    - skills/transversal/evidence_framing.md

  codex_skills:
    - .codex/skills/docs-alignment/SKILL.md
    - .codex/skills/document-control/SKILL.md
    - .codex/skills/plain-language-rewrite/SKILL.md

  rules:
    inherit: rules/global/global_rules.yaml
    domain:
      - rules/writing/writing_rules.yaml
      - rules/governance/governance_rules.yaml

  rubrics:
    - rubrics/documentation_quality_rubric.yaml

  templates:
    - templates/notion_report_template.md
    - templates/technical_appendix_template.md

  output_modes:
    - documentation_review
    - documentation_coverage_report
    - publication_readiness_review

  quality_gate:
    - source_of_truth_is_named
    - paths_and_commands_resolve
    - evidence_status_is_preserved
    - limitations_and_open_questions_are_explicit
    - publication_status_is_not_claimed_without_evidence
