writing_rules:

  structure:
    require_tldr: true
    require_section_hierarchy: true
    require_summary_before_details: true

  plots:
    every_plot_requires:
      - what we are looking on the plot
      - explanation of kpis or calculations on the plot
      - interpretation
      - operational_takeaway

  language:
    prefer_short_sentences: true
    prefer_active_voice: true
    answer_or_decision_first: true
    explain_unavoidable_jargon_on_first_use: true
    preserve_exact_paths_commands_numbers_dates_ids_and_status_labels: true
    avoid_marketing_language: true
    avoid_generic_ai_phrases: true
    prefer_brene_brown_style: true
    prefer_canadian_tone_when_on_english: true
    forbid_em_dash: true                    # U+2014 never. Substitute with comma, colon, parenthesis, or split the sentence.
    forbid_en_dash_outside_ranges: true     # U+2013 allowed only for strict numeric ranges (e.g. 2024 to 2026).

  plain_language:
    rule_id: .codex/rules/plain-language.md
    rewrite_skill: plain-language-rewrite
    simplify_style_only: true
    never_remove_material_caveats: true
    keep_blockers_visible: true
    max_decision_options_by_default: 2
    preserve_governance_states:
      - UNVERIFIED
      - CONTRACT_INCOMPLETE
      - CANDIDATE_SHADOW
      - BLOCKED_CONFIG_RESOLUTION
      - BLOCKED_DATA
      - BLOCKED_NO_SUPPORT


  storytelling:
    use_problem_to_solution_flow: true
    connect_sections_logically: true
    avoid_orphan_sections: true
    align_notion_docs_with_presentation_storyline_when_same_source: true
    use_findings_contract_for_analytical_outputs: rules/presentation/findings_contract.yaml

  formatting:
    prefer_dense_information: true
    avoid_visual_noise: true
