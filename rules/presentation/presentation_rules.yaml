presentation_rules:

  language:
    default_for_generated_decks: english
    preserve_domain_terms_when_clearer: true

  storytelling:
    prioritize_executive_summary: true
    top_down_structure: true
    business_impact_first: true
    use_claim_evidence_implication_note: true

  visuals:
    avoid_decorative_plots: true
    every_visual_requires_takeaway: true
    default_font: Noto Sans
    default_heading_font: Poppins
    default_numeric_font: IBM Plex Mono
    minimum_body_or_table_font_pt: 12
    minimum_table_header_font_pt: 14
    minimum_complementary_note_font_pt: 10
    split_tables_that_cannot_fit_minimum_font: true
    allow_theme_presets:
      - white_background
      - black_background
    default_theme_preset: white_background

  communication:
    explain_risk_clearly: true
    explain_tradeoffs: true
    avoid_overly_academic_language: true
    default_tone: concise_decision_oriented

  structure:
    one_main_message_per_slide: true
    speaker_notes_required: true
    appendix_separates_methodology: true
    insight_slide_frame:
      section_tag_eyebrow: true
      insight_title_leads_with_number: true
      why_it_matters_line_required: true
      action_line_required: true
      why_prefix: "Why it matters:"
      action_prefix: "Action >"
    section_dividers:
      required_for_multi_section_decks: true
      purpose: enable_powerpoint_section_zoom
      style:
        background: dark_cobalt          # BLUE_900 #001450
        accent_rail: pink_300
        number_size_pt: 180
        title_size_pt: 60
        subtitle_size_pt: 24

  brand:
    cqi_brand_reference: brands/cqi/brand_style/brand_style.md
    cqi_brand_archive: brands/cqi/brand_style/CQISense_Design_System.zip
    cqi_pptx_skill: brands/cqi/brand_style/pptx_skill_cqi.md
    cqi_template_pptx: brands/cqi/plantillas/CQI_PresentationTemplate_20260401.pptx
    deprecated_template_pptx_name: Template_CQISense.pptx
    primary_color: "#1A43F5"
    accent_color: "#FF8093"
    dark_neutral: "#232324"
    light_neutral: "#ffffff"
    archive_is_visual_source_of_truth: true
    avoid_improvised_palettes: true

  required_source_contract:
    every_claim_requires_source_path: true
    every_recommendation_requires_prior_finding: true
    missing_evidence_must_be_marked_as_hypothesis: true
