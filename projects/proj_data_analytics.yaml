project:
  id: proj_data_analytics
  name: "Project Data Analytics"
  version: "1.0.0"
  local_paths:
    primary: "/Users/jackyb-cqi/repos/proj_data_analytics"
    backup: "/Users/jackyb-cqi/repos/backup_repos/data_analytics"
  memory_home: "~/.negritaos/memory/projects/proj_data_analytics"
  archetypes:
    - eda_analytics
    - ml_automl
  capabilities:
    - eda
    - analytics
    - plots
    - causal_analysis
    - ml
    - automl
    - production_audit
    - bigquery
    - local_files
  skill_profiles:
    - analytical-eda
    - data-source-bigquery
    - elal-eda-governance
    - elal-analytical-deck
  data_source:
    provider: bigquery
    dialect: google_standard_sql
    source_of_truth: governed_remote_source
    access: read_sources_write_governed_output
    write_controls:
      default_mode: read_only
      governed_profiles:
        - id: elal_rules_revision
          allowed_project: cqi-elal-dev-6345
          allowed_datasets:
            - ANALYTICS
          required_table_suffix: _rev
          allowed_operations:
            - CREATE_TABLE_IF_NOT_EXISTS
            - INSERT_APPEND
          prohibited_operations:
            - CREATE_OR_REPLACE
            - DROP
            - ALTER
            - TRUNCATE
            - UPDATE
            - DELETE
            - MERGE
  analysis_governance:
    phase: warn_first
    scope: new_or_migrated_analyses
  governance_controls:
    elal_presentation:
      applies_to: "All ELAL PPTX creation, editing, review, audit, and release."
      mandatory_skill: ".codex/skills/elal-product-owner-presentation/SKILL.md"
      governance_document: "projects/elal_presentation_governance.md"
      artifact_register: "projects/elal_presentation_artifact_register.yaml"
      source_project_root: "/Users/jackyb-cqi/repos/proj_data_analytics"
      authoritative_reference_deck:
        path: "analyses/poc_elal_passenger_journey/documents/elal_passenger_journey_product_owner_summary_44slides_20260804_final_no_text_frames.pptx"
        sha256: "b5bbf5eb7b940b7681bcf227cd0bf38e0c953d258d87cd7686a27682d4252c28"
        observed_slide_count: 46
        observed_note_count: 46
    elal_rule_traceability:
      applies_to: "Any ELAL rule, source rail, outcome, score, state, chip, treatment, implementation, or rule-related deck claim change."
      mandatory_skill: ".codex/skills/elal-rule-traceability/SKILL.md"
      ledger: "projects/elal_rule_traceability.yaml"
      governance_document: "projects/elal_rule_traceability.md"
      validator: ".codex/skills/elal-rule-traceability/scripts/validate_rule_traceability.py"
      control_mode: append_only
  agents:
    - eda_reviewer_agent
    - model_review_agent
    - data_quality_sentinel_agent
    - code_review_agent
    - pull_request_reviewer_agent
    - team_lead_ds_agent
    - technical_writer_agent
    - presentation_agent
    - plot_analysis_agent
    - ai_trend_radar_agent
    - git_tree_governance_agent
  codex_profiles:
    - analysis-run
    - eda-pre-ml
    - review
    - refactor
  # Explicit intent -> NegritaOS mode map.
  # Consulted by the router BEFORE the global trigger table
  # (see rules/global/negritaos_router_rule.md §2).
  mode_map:
    new_feature: CR        # implement code / SQL / pipeline -> code_review_agent
    bug_fix: CR
    refactor: CR
    new_analysis: MR       # EDA / model review / SHAP / leakage -> model_review_agent
    eda: MR
    model_review: MR
    data_incident: DQ      # schema drift / KPI anomaly / RCA -> data_quality_sentinel_agent
    data_quality_audit: DQ
    planning: LP           # sprint / roadmap / OKR -> team_lead_ds_agent
    writeup: TD            # notion / confluence / postmortem -> technical_writer_agent
    deck: EP               # exec deck / one-pager -> presentation_agent
    research: RT           # papers / trend scouting -> ai_trend_radar_agent
  expected_outputs:
    - eda_report
    - analytical_report
    - plot_interpretation
    - model_review_report
    - notion_doc
    - executive_summary
    - executive_presentation
    - task_register
  preservation:
    backup_required_before_migration: true
    repo_codex_status: "ignored_local"
    canonical_memory_outside_repo: true
    latest_preservation_backup: "~/.negritaos/backups/2026-05-17_150934/proj_data_analytics"
  notes:
    - "Legacy .codex/memory contains MoneyFlow-like entries; curate before treating legacy import as canonical."
