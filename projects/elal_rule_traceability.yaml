rule_registry:
  - id: RUL-V8-OPERATIONAL-ONLY-REV
    title: Revised V8 contains operational event facts only
    state: SHADOW_CANDIDATE
    source_artifact_ids: [SRC-RULE-PRODUCTION-EVALUATION-20260804, SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1]
    implementation_artifact_ids: []
    decision_boundary: Existing V8 tables and productive F_NEG_08 remain immutable; only the new _rev shadow output removes call evidence from V8.
  - id: RUL-CALL-REASON-SUBREASON-REV
    title: Revised V9 candidate reason and subreason call scoring
    state: SHADOW_CANDIDATE
    source_artifact_ids: [SRC-RULE-PRODUCTION-EVALUATION-20260804, SRC-FRICTION-V7, SRC-PROMISE-V2]
    contract_ids: [CTR-CALL-DIRECT-V3, CTR-OVERBOOKING-AUDIT, CTR-OUTCOMES-V1]
    implementation_artifact_ids: []
    decision_boundary: Only exact member-flight identity can score; shared-phone coverage is candidate, Dani overbooking has precedence, and transcript handling is not an outcome.
  - id: RUL-V10-WEEKLY-RECOVERY-REV
    title: Weekly V10 recovery candidate with tier-specific time and clean-flight gates
    state: SHADOW_CANDIDATE
    source_artifact_ids: [SRC-RULE-PRODUCTION-EVALUATION-20260804, SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1, CTR-OUTCOMES-V1]
    implementation_artifact_ids: [IMP-V10-TRANSITION-GUARDRAILS-SQL]
    decision_boundary: Weekly cuts are reconstruction evidence only; Critical may exit only to High after the governed time and clean-flight gates.
  - id: RUL-SEVERE-CHIP-4STATE-REV
    title: Four-state severe-context chip candidate
    state: CONTEXT_ONLY
    source_artifact_ids: [SRC-RULE-PRODUCTION-EVALUATION-20260804, SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1]
    implementation_artifact_ids: [IMP-V10-TRANSITION-GUARDRAILS-SQL]
    decision_boundary: The simplified chip preserves severe-event memory as context and never changes score, segment, colour, or points.
  - id: RUL-FRICTION-PROMISE-TAXONOMY
    title: Friction and promise taxonomy
    state: CURRENT_GOVERNED_BASELINE
    source_artifact_ids: [SRC-FRICTION-V7, SRC-PROMISE-V2]
    contract_ids: []
    implementation_artifact_ids: []
    decision_boundary: A friction is not automatically a promise; preserve the governed taxonomy versions.
  - id: RUL-ATTENTION-LAYERS
    title: Separate score, state, chip, and treatment layers
    state: CURRENT_GOVERNED_BASELINE
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1]
    implementation_artifact_ids: [IMP-V10-TRANSITION-GUARDRAILS-SQL]
    decision_boundary: Do not create a super-score or allow a presentation layer to silently modify another layer.
  - id: RUL-V10-TRANSITION-GUARDRAIL
    title: V10 score/state guardrails
    state: CURRENT_GOVERNED_BASELINE
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1]
    implementation_artifact_ids: [IMP-V10-TRANSITION-GUARDRAILS-SQL]
    decision_boundary: Same-snapshot V9/V10 comparisons are reclassification crosswalks, not temporal movement.
  - id: RUL-SEVERE-CHIP-CONTEXT
    title: Severe chip is contextual and does not directly change colour or state
    state: CONTEXT_ONLY
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1]
    implementation_artifact_ids: [IMP-V10-TRANSITION-GUARDRAILS-SQL]
    decision_boundary: A contextual chip must not become a hidden score or colour override.
  - id: RUL-TIER-TREATMENT-NO-SCORE
    title: Tier modifies treatment, not the pressure score
    state: CONTEXT_ONLY
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1]
    implementation_artifact_ids: [IMP-V10-TRANSITION-GUARDRAILS-SQL]
    decision_boundary: Tier can affect priority, outreach, escalation, or SLA only under an explicit approved policy.
  - id: RUL-CALL-RAIL-FRPR
    title: Direct FR/PR metadata is the active call rail
    state: ACTIVE_DATA_CONTRACT
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-CALL-DIRECT-V3, CTR-IA-CALLS-DEPRECATED]
    implementation_artifact_ids: [IMP-ATTENTION-POLICY-BACKTEST-SQL]
    decision_boundary: Do not use a broad additive union or FULL OUTER JOIN between direct FR/PR metadata and deprecated IA calls.
  - id: RUL-OUTCOME-ELIGIBILITY
    title: Only governed operational completion/refund sources can prove an outcome
    state: CURRENT_GOVERNED_BASELINE
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-OUTCOMES-V1]
    implementation_artifact_ids: [IMP-ATTENTION-POLICY-BACKTEST-SQL]
    decision_boundary: Transcript resolved or acknowledged language is a signal, never a verified operational outcome.
  - id: RUL-OVERBOOKING
    title: Overbooking operational cause rule
    state: SHADOW_CANDIDATE
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-OVERBOOKING-AUDIT, CTR-OUTCOMES-V1]
    implementation_artifact_ids: [IMP-ATTENTION-POLICY-BACKTEST-SQL]
    decision_boundary: Do not promote until the operational taxonomy, association, deduplication, precedence, points, outcome evidence, and owner approvals are governed.
  - id: RUL-CALL-CLASSIFICATION-S3
    title: Candidate call classification treatment
    state: SHADOW_CANDIDATE
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-CALL-DIRECT-V3]
    implementation_artifact_ids: [IMP-ATTENTION-POLICY-BACKTEST-SQL, IMP-ATTENTION-POLICY-BACKTEST-RUNNER]
    decision_boundary: A future candidate may replace F_NEG_08; it must not score every FR/PR call as an additive event.
  - id: RUL-RECOVERY-S5
    title: Recovery treatment from V9/V10 crosswalk
    state: INSUFFICIENT_EVIDENCE
    source_artifact_ids: [SRC-RULE-DOC-20260729]
    contract_ids: [CTR-ATTENTION-LAYERS-V1]
    implementation_artifact_ids: [IMP-V10-TRANSITION-GUARDRAILS-SQL]
    decision_boundary: The available same-date snapshot is insufficient to prove recovery or flapping.
  - id: RUL-FLIGHT360-MEMBER-LEG-CALL-CANDIDATE
    title: Flight360 member-leg map with direct-call candidate association
    state: INSUFFICIENT_EVIDENCE
    source_artifact_ids: [SRC-FOUR-TABLES-CATALOG]
    contract_ids: [CTR-CALL-DIRECT-V3]
    implementation_artifact_ids: []
    decision_boundary: Flight360 TMP.cqi_events_passenger_p is an affected member-event map, not a complete aircraft manifest. Its nearest_segment_id retains zero or one nearest call candidate per member-flight-date, so it can support aggregate candidate association only and cannot measure, prove, or disprove repeated passenger calls.

