  resolution_rule: All source, contract, and implementation paths in this ledger are relative to this external project root.

ledger_policy:
  mode: append_only
  canonical_use: >-
    This file is the index for rule-change evidence and decisions. It does not
    replace a data, outcome, or product-policy contract.
  amendment_rule: >-
    Do not alter or delete a historical change record. Append a later record
    with previous_change_id and supersedes to correct, withdraw, or replace it.
  required_before_claiming_a_change: >-
    An impacted rule, source/contract, implementation artifact, validation
    result, decision owner and status, policy effect, and deck/product impact.
  immutable_source_rule: >-
    PDF and DOCX source artifacts are evidence. Do not move, rename, overwrite,
    or normalize them as part of a rule change; retain their recorded digest.

controlled_rule_states:
  - CURRENT_GOVERNED_BASELINE
  - ACTIVE_DATA_CONTRACT
  - CONTEXT_ONLY
  - SHADOW_CANDIDATE
  - INSUFFICIENT_EVIDENCE
  - DEPRECATED

