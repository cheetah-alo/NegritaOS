    backup_required_before_migration: true
    repo_codex_status: "adapter_local"
    canonical_memory_outside_repo: true
  notes:
    - "Repository root is not currently a Git repo; preserve nested analysis/document structure and do not assume git operations are available there."
    - "Use the canonical NegritaOS adapter symlinks under .codex for rules, commands, manifest, and router skill."
    - "Stage 1 incident work is trend-layer first; deterministic incident rules remain the source of truth before prediction or severity calibration."
    - "BigQuery inventory artifacts indicate missing topology/population-denominator and generated-incident labels; do not overclaim model readiness without owner confirmation."
    - "Treat generated CSV outputs, plots, PDFs, PPTX files, and local research documents as local evidence artifacts unless explicitly promoted to a deliverable."
