project:
  id: ibc_fiber_network
  name: "IBC Fiber Network"
  version: "1.0.0"
  description: >
    Fiber network analytics workspace for HOT / IBC incident and ML-readiness
    work. The repo contains BigQuery inventory reviews, deterministic incident
    trend-layer code, data contracts, plot/report builders, CSV table schemas,
    and research/PPT source documents for fiber fault monitoring and telecom
    alarm analysis.
  local_paths:
    primary: "/Users/jackyb-cqi/repos/ibc_fiber_network"
  memory_home: "~/.negritaos/memory/projects/ibc_fiber_network"
  archetypes:
