project:
  id: tepulume_workspace
  name: "Tepulume Workspace"
  version: "1.0.0"
  description: >
    Parent workspace for Tepulume brand, website, and social-media operations.
    The folder itself is not a Git repository; it coordinates two independent
    child Git repositories: the corporate landing/web app and the social-media
    editorial system.
  local_paths:
    primary: "/Users/jackyb-cqi/repos/backup_repos/tepulume"
    landing: "/Users/jackyb-cqi/repos/backup_repos/tepulume/tepulume-landing"
    social: "/Users/jackyb-cqi/repos/backup_repos/tepulume/tepulume-social"
  memory_home: "~/.negritaos/memory/projects/tepulume_workspace"
  archetypes:
    - brand_workspace
    - product_marketing
    - content_operations
  capabilities:
    - brand_strategy
    - website_governance
    - social_media_governance
    - content_strategy
    - delivery_tracking
    - technical_documentation
    - local_files
  agents:
    - decision_support_agent
    - technical_writer_agent
    - presentation_agent
    - plot_analysis_agent
    - team_lead_ds_agent
    - data_quality_sentinel_agent
    - code_review_agent
    - pull_request_reviewer_agent
    - software_architect_agent
  codex_profiles:
    - review
    - refactor
  mode_map:
    brand_strategy: LP
    roadmap: LP
    planning: LP
    landing_work: CR
    website_governance: CR
    social_media_governance: TD
    content_strategy: TD
    editorial_calendar: DQ
    evidence_inventory: DQ
    deck: EP
  expected_outputs:
    - operating_model
    - roadmap
    - brand_strategy_note
    - content_strategy
    - editorial_calendar_review
    - website_change_plan
    - decision_memo
    - task_register
  preservation:
    backup_required_before_migration: true
    repo_codex_status: "adapter_local"
    canonical_memory_outside_repo: true
  related_projects:
    - tepulume_landing
    - tepulume_social
  notes:
    - "Workspace root is not a Git repository; do not assume git operations are available at the parent level."
    - "Open tepulume-landing directly for web code, build, Sites, Cloudflare, or deployment work."
    - "Open tepulume-social directly for editorial calendar, Meta publishing, source registry, or brand-voice work."
    - "Keep landing/web source changes separate from social-media content operations."
    - "Use LP mode for cross-workstream planning, brand positioning, roadmap, dependencies, and prioritization."
    - "Use TD mode for brand narrative, content strategy, and editorial writeups."
    - "Use DQ mode for calendar completeness, source verification, evidence inventory, or publishing readiness checks."
    - "Use document-control for new agent-authored reports, decks, PDFs, DOCX, HTML deliverables, or markdown deliverables under an explicit user-selected output path; documents/ remains optional."
