project:
  id: negritaos
  name: "NegritaOS"
  version: "1.0.0"
  local_paths:
    primary: "/Users/jackyb-cqi/repos/NegritaOS"
  memory_home: "~/.negritaos/memory/projects/negritaos"
  archetypes:
    - data_platform
  capabilities:
    - cognitive_os
    - agent_registry
    - memory_governance
    - project_routing
    - documentation
    - academic_research
    - academic_tfm_support
  skill_profiles:
    - academic-tfm-review
    - academic-tfm-research
    - git-tree-governance
  integration_branch: main
  git_governance:
    worktree_mode: one_objective_per_worktree
    dirty_context_blocks_new_mutation: true
    detached_worktree_read_only: true
    wip_checkpoint_allowed: true
    max_unmerged_commits: 5
    rebase: explicit_only
    cherry_pick: atomic_only
    deletion_requires_inventory_backup_approval: true
  agents:
    - team_lead_ds_agent
    - decision_support_agent
    - technical_writer_agent
    - presentation_agent
    - plot_analysis_agent
    - code_review_agent
    - pull_request_reviewer_agent
    - software_architect_agent
    - tfm_evaluator_agent
    - proposal_validator_agent
    - paper_review_agent
    - tfm_research_advisor_agent
    - ai_trend_radar_agent
    - git_tree_governance_agent
  mode_map:
    git_tree_review: GT
    branch_lifecycle_audit: GT
  expected_outputs:
    - decision_memo
    - operating_model
    - implementation_plan
    - task_register
    - notion_doc
    - executive_presentation
  preservation:
    backup_required_before_migration: true
    repo_codex_status: "system_local"
    canonical_memory_outside_repo: true
    latest_preservation_backup: "~/.negritaos/backups/2026-05-17_150934"
