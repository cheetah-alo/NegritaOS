  execution_policy:
    default_behavior:
      - classify_request
      - select_agent
      - load_global_rules
      - load_agent_rules
      - load_skills
      - load_rubrics
      - load_template
      - generate_output
      - run_quality_gate
      - provide_final_answer

    ambiguity_policy:
      if_minor_ambiguity:
        action: "make_reasonable_assumption_and_state_it"
      if_major_ambiguity:
        action: "ask_targeted_followup_question"

    evidence_policy:
      if_evidence_missing:
        action: "state_limitations_and_mark_as_hypothesis"

    web_research_policy:
      required_for:
        - current_ai_trends
        - current_blockchain_trends
        - recent_papers
        - tools_or_frameworks_after_2025
        - regulation_or_governance_updates
