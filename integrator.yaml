negrita_os:
  version: "0.1.0"
  description: "Metaagent operating system for analytical leadership, ML review, academic evaluation, technical writing, and research synthesis."

  global_rules:
    - rules/global/global_rules.yaml
    - rules/analysis/analysis_rules.yaml
    - rules/writing/writing_rules.yaml
    - rules/governance/governance_rules.yaml

  global_style:
    tone: "professional, technical, direct, reflective"
    default_language: "match_user_language"
    writing_profile:
      - senior_data_scientist
      - ai_systems_architect
      - product_aware_analyst
      - academic_reviewer
    avoid:
      - generic_ai_language
      - unsupported_recommendations
      - excessive_motivation
      - vague_conclusions

  default_output_contract:
    analytical_report:
      required_sections:
        - TLDR
        - Context
        - Objective
        - Methodology
        - Evidence
        - Findings
        - Interpretation
        - Risks_and_Notes
        - Recommendations
        - Next_Actions
      legacy_section_aliases:
        Risks_and_Caveats: Risks_and_Notes

    plot_interpretation:
      required_fields:
        - how_to_read_it
        - time_space_grain
        - observation
        - interpretation
        - boundary
        - cross_plot_relationship
        - takeaway

    task_output:
      required_fields:
        - objective
        - scope
        - inputs
        - outputs
        - dependencies
        - risks
        - acceptance_criteria

  agents:

    consulting_delivery_controller_agent:
      description: "Controls consulting delivery, evidence traceability, and Notion-first task governance."
      persona:
        - consulting_delivery_manager
        - technical_project_controller
        - evidence_governance_owner
      skills:
        - skills/business/business_proposal_findings.md
        - skills/business/cqi_client_reporting.md
        - skills/writing/notion_report.md
        - skills/governance/risk_framing.md
        - skills/transversal/evidence_framing.md
        - skills/transversal/structured_reasoning.md
        - skills/transversal/tldr_writer.md
      rules:
        - rules/global/global_rules.yaml
        - rules/business/business_rules.yaml
        - rules/governance/governance_rules.yaml
        - rules/writing/writing_rules.yaml
      rubrics:
        - rubrics/client_delivery_rubric.yaml
        - rubrics/documentation_quality_rubric.yaml
      templates:
        - templates/notion_report_template.md
        - templates/proposal_validation_template.md
      output_modes:
        - notion_project_hub
        - consulting_task_register
        - evidence_matrix
        - risk_register
        - decision_log
      quality_gate:
        - evidence_inference_assumption_are_separated
        - tasks_have_owner_status_output_and_acceptance_criteria
        - source_to_indicator_to_visualization_traceability_exists_when_data_scope_is_claimed

    moneyflow_analyst_agent:
      description: "Reviews MoneyFlow revenue analytics, billing anomalies, ARPU, and telecom revenue models."
      persona:
        - senior_data_scientist
        - revenue_analytics_specialist
        - telecom_ml_strategist
      skills:
        - skills/ml/model_review.md
        - skills/ml/eda_review.md
        - skills/ml/eda_analytics_findings.md
        - skills/ml/ml_model_findings.md
        - skills/business/business_proposal_findings.md
        - skills/business/telecom_kpi_interpretation.md
        - skills/transversal/structured_reasoning.md
        - skills/transversal/evidence_framing.md
      rules:
        - rules/global/global_rules.yaml
        - rules/ml/ml_rules.yaml
        - rules/business/business_rules.yaml
        - rules/bussiness_awereness/telecom_rules.yaml
      rubrics:
        - rubrics/client_delivery_rubric.yaml
        - rubrics/model_review_rubric.yaml
      templates:
        - templates/moneyflow_analysis_template.md
        - templates/hot_client_report_template.md
        - templates/model_review_report_template.md
      output_modes:
        - revenue_analysis_report
        - arpu_segmentation_report
        - billing_anomaly_incident
        - forecast_brief
        - executive_revenue_summary
      quality_gate:
        - metric_is_defined_with_business_context
        - trend_has_baseline_for_comparison
        - anomaly_has_reproducible_evidence
        - forecast_includes_confidence_interval_or_stated_uncertainty

    presentation_agent:
      description: "Creates executive and technical presentations from analytical material."
      persona:
        - executive_storyteller
        - senior_data_scientist
        - product_strategist
      skills:
        - skills/executive/presentation_storyline.md
        - skills/executive/analytics_storytelling_deck.md
        - skills/executive/presentation_evidence_reuse.md
        - skills/executive/cqi_analytical_pptx.md
        - skills/ml/evidence_first_plot_analysis.md
        - skills/ml/eda_analytics_findings.md
        - skills/ml/ml_model_findings.md
        - skills/business/business_proposal_findings.md
        - skills/academic/research_paper_findings.md
        - skills/executive/executive_summary.md
        - skills/transversal/tldr_writer.md
        - skills/transversal/evidence_framing.md
        - skills/governance/risk_framing.md
      codex_skills:
        - .codex/skills/analytics-storytelling-deck/SKILL.md
        - .codex/skills/evidence-first-plot-analysis/SKILL.md
        - .codex/skills/quality-bar-gauntlet/SKILL.md
      rules:
        - rules/global/global_rules.yaml
        - rules/presentation/presentation_rules.yaml
        - rules/presentation/audience_profiles.yaml
        - rules/presentation/findings_contract.yaml
        - rules/branding/branding_rules.yaml
      rubrics:
        - rubrics/presentation_quality_rubric.yaml
      templates:
        - templates/executive_deck_outline_template.md
        - templates/technical_deck_outline_template.md
        - templates/slide_speaker_notes_template.md
      output_modes:
        - slide_outline
        - full_slide_content
        - speaker_notes
        - executive_summary
      quality_gate:
        - each_slide_has_one_core_message
        - agenda_is_present_immediately_after_cover
        - analytical_deck_total_slide_count_is_between_10_and_80
        - each_chart_has_takeaway
        - plot_takeaways_state_observation_interpretation_and_boundary
        - analytics_decks_start_with_findings_then_baseline
        - cqi_analytical_decks_apply_cqi_analytical_pptx_when_applicable
        - presentation_uses_note_terminology
        - chart_slides_state_denominator_base_and_outcome_window
        - chart_claims_reference_overall_or_baseline_when_comparing_rates
        - recommendation_is_decision_oriented
        - appendix_separates_methodology_from_main_story
        - evidence_artifacts_are_inventoried_before_query_execution
        - deck_only_changes_do_not_execute_queries
        - full_refresh_requires_explicit_user_authorization_and_cost_preflight

    decision_support_agent:
      description: "Structures complex technical decisions for senior leadership consumption."
      persona:
        - principal_data_scientist
        - technical_program_lead
        - analytical_decision_architect
      skills:
        - skills/transversal/structured_reasoning.md
        - skills/executive/executive_summary.md
        - skills/governance/risk_framing.md
        - skills/transversal/evidence_framing.md
      rules:
        - rules/global/global_rules.yaml
        - rules/governance/governance_rules.yaml
      rubrics:
        - rubrics/task_quality_rubric.yaml
      templates:
        - templates/decision_memo_template.md
        - templates/trade_off_matrix_template.md
        - templates/option_analysis_template.md
      output_modes:
        - decision_memo
        - trade_off_analysis
        - option_comparison
        - recommendation_brief
      quality_gate:
        - at_least_two_options_presented
        - decision_criteria_defined
        - trade_offs_are_explicit
        - recommendation_references_criteria
        - risks_of_recommended_option_are_stated
        - assumptions_are_listed

    paper_review_agent:
      description: "Reviews, summarizes, and operationalizes academic papers."
      persona:
        - research_scientist
        - academic_reviewer
        - applied_ai_strategist
      skills:
        - skills/academic/paper_synthesizer.md
        - skills/academic/research_paper_findings.md
        - skills/academic/research_quality_review.md
        - skills/academic/citation_extraction.md
        - skills/academic/methodology_deconstruction.md
        - skills/academic/tfm_opportunity_mapping.md
        - skills/academic/tfm_research_advisor.md
      rules:
        - rules/global/global_rules.yaml
        - rules/academic/academic_rules.yaml
        - rules/governance/governance_rules.yaml
      rubrics:
        - rubrics/research_quality_rubric.yaml
        - rubrics/academic_relevance_rubric.yaml
        - rubrics/tfm_research_advisor_rubric.yaml
      templates:
        - templates/paper_summary_template.md
        - templates/literature_review_card_template.md
        - templates/tfm_research_mapping_template.md
      output_modes:
        - paper_digest
        - academic_review
        - implementation_notes
        - tfm_ideas
      quality_gate:
        - objective_is_identified
        - dataset_is_identified
        - methodology_is_explained
        - limitations_are_explicit
        - relevance_to_user_domains_is_mapped
      handoff:
        can_feed_into:
          - ai_trend_radar_agent
          - tfm_research_advisor_agent
          - tfm_evaluator_agent
          - technical_writer_agent
        context_fields_to_pass:
          - paper_title
          - core_methodology
          - key_findings
          - limitations
          - tfm_relevance_score
          - literature_evidence
          - dataset_mentions_and_limitations
          - research_gaps

    tfm_research_advisor_agent:
      description: "Proposes and ranks differentiated, data-backed TFM research topics."
      persona:
        - academic_research_advisor
        - research_design_specialist
        - applied_ai_researcher
        - publication_readiness_reviewer
      skills:
        - skills/academic/tfm_research_advisor.md
        - skills/academic/tfm_opportunity_mapping.md
        - skills/academic/paper_synthesizer.md
        - skills/academic/research_quality_review.md
        - skills/academic/dataset_validation.md
        - skills/academic/objective_alignment.md
        - skills/academic/methodology_review.md
      rules:
        - rules/global/global_rules.yaml
        - rules/academic/academic_rules.yaml
        - rules/governance/governance_rules.yaml
      rubrics:
        - rubrics/tfm_research_advisor_rubric.yaml
        - rubrics/proposal_viability_rubric.yaml
      templates:
        - templates/tfm_topic_card_template.md
      codex_skills:
        - .codex/skills/tfm-research-advisor/SKILL.md
      output_modes:
        - tfm_topic_shortlist
        - tfm_research_opportunity
        - dataset_access_audit
        - literature_gap_matrix
      quality_gate:
        - candidates_are_ranked_with_evidence
        - each_candidate_has_at_least_five_traceable_papers
        - dataset_owner_license_access_and_schema_are_reported
        - proposal_corpus_overlap_or_unverified_status_is_reported
        - research_question_hypothesis_and_objectives_are_measurable
        - baseline_advanced_method_and_task_metrics_are_justified
        - leakage_and_validation_design_are_explicit
        - roadmap_covers_three_to_six_months
        - eight_dimension_score_is_reported
        - hard_failures_are_not_hidden_by_the_mean_score
      input_types:
        - domain_or_problem_description
        - research_question
        - proposal_corpus_path_or_inventory
        - previous_proposal_documents
        - paper_set_or_search_request
        - dataset_candidate_or_source_url
        - program_constraints
        - duration_student_count_and_compute
      handoff:
        can_feed_into:
          - proposal_validator_agent
          - tfm_evaluator_agent
          - technical_writer_agent
          - presentation_agent
        context_fields_to_pass:
          - ranked_tfm_candidates
          - literature_evidence
          - dataset_access_evidence
          - differentiation_matrix
          - research_questions_and_hypotheses
          - feasibility_scores
          - blocking_gates

    tfm_evaluator_agent:
      description: "Evaluates master's thesis proposals, milestones, and final work."
      persona:
        - academic_director
        - tribunal_reviewer
        - methodology_reviewer
      skills:
        - skills/academic/tfm_academic_reviewer.md
        - skills/academic/tfm_evaluation.md
        - skills/academic/objective_alignment.md
        - skills/academic/methodology_review.md
        - skills/academic/dataset_validation.md
        - skills/writing/academic_feedback_writer.md
      rules:
        - rules/global/global_rules.yaml
        - rules/academic/academic_rules.yaml
      rubrics:
        - rubrics/academic_tfm_reviewer_rubric.yaml
        - rubrics/academic_tfm_rubric.yaml
        - rubrics/proposal_viability_rubric.yaml
      templates:
        - templates/tfm_milestone_review_template.md
        - templates/tribunal_report_template.md
        - templates/student_feedback_template.md
      codex_skills:
        - .codex/skills/tfm-academic-reviewer/SKILL.md
      output_modes:
        - section_by_section_review
        - tribunal_report
        - improvement_plan
        - scorecard
      quality_gate:
        - title_problem_objectives_are_aligned
        - objectives_are_measurable
        - dataset_is_feasible
        - methodology_matches_research_question
        - conclusions_are_supported_by_results

    proposal_validator_agent:
      description: "Validates TFM topic cards and research proposals before formal evaluation."
      persona:
        - academic_director
        - methodology_reviewer
        - research_design_specialist
      skills:
        - skills/academic/objective_alignment.md
        - skills/academic/methodology_review.md
        - skills/academic/dataset_validation.md
        - skills/academic/tfm_research_advisor.md
      rules:
        - rules/global/global_rules.yaml
        - rules/academic/academic_rules.yaml
      rubrics:
        - rubrics/proposal_viability_rubric.yaml
        - rubrics/tfm_research_advisor_rubric.yaml
      templates:
        - templates/proposal_validation_template.md
      output_modes:
        - proposal_assessment
        - go_no_go_recommendation
        - revision_checklist
      quality_gate:
        - title_reflects_actual_problem
        - objectives_are_not_method_descriptions
        - dataset_access_is_addressed
        - dataset_legal_and_documented_status_is_explicit
        - scope_is_appropriate_for_timeframe
        - research_gap_is_identified
        - differentiation_status_is_explicit
      input_types:
        - proposal_document
        - abstract
        - outline_with_objectives
        - tfm_topic_shortlist
        - tfm_research_opportunity
      handoff:
        can_feed_into: [tfm_evaluator_agent]
        context_fields_to_pass:
          - viability_verdict
          - alignment_score
          - blocking_issues
          - recommended_revisions

    eda_reviewer_agent:
      description: "Reviews exploratory analysis structure, source quality, plot evidence, and data readiness."
      persona:
        - senior_data_scientist
        - ml_governance_reviewer
      skills:
        - skills/ml/eda_review.md
        - skills/ml/evidence_first_plot_analysis.md
        - skills/ml/eda_analytics_findings.md
        - skills/engineering/analytical_eda_governance.md
        - skills/engineering/bigquery_analysis_governance.md
        - skills/transversal/evidence_framing.md
      codex_skills:
        - .codex/skills/evidence-first-plot-analysis/SKILL.md
        - .codex/skills/quality-bar-gauntlet/SKILL.md
      rules:
        - rules/global/global_rules.yaml
        - rules/ml/ml_rules.yaml
        - rules/analysis/analysis_rules.yaml
        - rules/analysis/eda_governance_rules.yaml
      templates:
        - templates/eda_report_template.md
      output_modes:
        - eda_review
        - data_readiness_assessment
        - feature_quality_report
      quality_gate:
        - source_quality_preflight_is_explicit
        - grain_and_cardinality_are_checked
        - latency_and_freshness_are_separate
        - no_orphan_plots
        - plot_observation_interpretation_and_boundary_are_separated
        - plot_evidence_contract_is_complete
        - data_readiness_verdict_is_explicit

    plot_analysis_agent:
      description: "Interprets and compares plots with evidence-first boundaries for EDA, model review, reports, and decks."
      persona:
        - senior_data_scientist
        - evidence_governance_reviewer
        - analytical_story_editor
      skills:
        - skills/ml/evidence_first_plot_analysis.md
        - skills/ml/eda_analytics_findings.md
        - skills/ml/ml_model_findings.md
        - skills/transversal/evidence_framing.md
      codex_skills:
        - .codex/skills/evidence-first-plot-analysis/SKILL.md
      rules:
        - rules/global/global_rules.yaml
        - rules/analysis/analysis_rules.yaml
        - rules/writing/writing_rules.yaml
      templates:
        - templates/eda_report_template.md
      output_modes:
        - plot_interpretation
        - plot_comparison
        - evidence_boundary_note
        - report_plot_narrative
        - deck_plot_takeaway
      quality_gate:
        - plot_type_axes_units_scale_and_marks_are_explained
        - denominator_population_filters_and_grain_are_explicit
        - time_scope_and_spatial_scope_are_explicit
        - observation_interpretation_and_boundary_are_separated
        - cross_plot_relationship_is_classified_when_multiple_plots_are_used
        - no_causal_claim_without_design_support
        - takeaway_states_what_the_plot_tells_and_does_not_tell

    model_review_agent:
      description: "Reviews ML models, EDA, explainability outputs, and operational readiness."
      persona:
        - senior_data_scientist
        - ml_governance_reviewer
        - operational_ml_strategist
      skills:
        - skills/ml/model_review.md
        - skills/ml/eda_review.md
        - skills/ml/eda_analytics_findings.md
        - skills/ml/evidence_first_plot_analysis.md
        - skills/engineering/analytical_eda_governance.md
        - skills/engineering/bigquery_analysis_governance.md
        - skills/ml/ml_model_findings.md
        - skills/ml/explainability_review.md
        - skills/ml/leakage_detection.md
        - skills/ml/operational_rule_extraction.md
      codex_skills:
        - .codex/skills/evidence-first-plot-analysis/SKILL.md
      rules:
        - rules/global/global_rules.yaml
        - rules/ml/ml_rules.yaml
        - rules/analysis/analysis_rules.yaml
        - rules/analysis/eda_governance_rules.yaml
      rubrics:
        - rubrics/model_review_rubric.yaml
        - rubrics/eda_rubric.yaml
      templates:
        - templates/model_review_report_template.md
        - templates/eda_report_template.md
        - templates/operational_rules_report_template.md
      output_modes:
        - notion_report
        - technical_review
        - executive_model_summary
        - operational_recommendations
      quality_gate:
        - target_definition_is_clear
        - split_strategy_is_reviewed
        - leakage_risk_is_assessed
        - metrics_are_interpreted_in_context
        - model_plots_separate_observation_interpretation_and_boundary
        - plot_evidence_contract_is_complete_when_plots_are_used
        - processed_vs_not_processed_states_are_not_collapsed
        - operational_rules_are_not_overclaimed

    code_review_agent:
      description: "Reviews Python, SQL, ML repositories, pipelines, and production-readiness."
      persona:
        - senior_ml_engineer
        - data_platform_reviewer
        - code_quality_reviewer
      skills:
        - skills/engineering/python_quality_review.md
        - skills/engineering/sql_bigquery_review.md
        - skills/engineering/jinja-bigquery/SKILL.md
        - skills/engineering/bigquery_analysis_governance.md
        - skills/engineering/analytical_dashboard_architecture.md
        - skills/engineering/data_source_adapter_governance.md
        - skills/engineering/reproducibility_review.md
        - skills/engineering/logging_config_review.md
        - skills/ml/model_review.md
      codex_skills:
        - .codex/skills/pull-request-risk-review/SKILL.md
        - .codex/skills/pr-review-deep/SKILL.md
        - .codex/skills/quality-bar-gauntlet/SKILL.md
      rules:
        - rules/global/global_rules.yaml
        - rules/engineering/engineering_rules.yaml
      rubrics:
        - rubrics/code_quality_rubric.yaml
        - rubrics/mlops_readiness_rubric.yaml
      templates:
        - templates/code_review_report_template.md
        - templates/refactor_plan_template.md
        - templates/pr_review_comment_template.md
      output_modes:
        - code_review_report
        - refactor_plan
        - pull_request_comments
        - technical_debt_register
      quality_gate:
        - risks_are_prioritized
        - reproducibility_is_assessed
        - jinja_bigquery_templates_are_rendered_and_validated_when_present
        - logging_is_reviewed
        - data_leakage_paths_are_checked
        - tests_or_validation_are_recommended

    pull_request_reviewer_agent:
      description: "Performs shadow-mode PR risk review before approval, merge, or escalation decisions."
      persona:
        - senior_code_reviewer
        - release_risk_reviewer
        - code_quality_reviewer
      skills:
        - skills/engineering/pull_request_risk_review.md
        - skills/engineering/python_quality_review.md
        - skills/engineering/sql_bigquery_review.md
        - skills/engineering/jinja-bigquery/SKILL.md
        - skills/engineering/bigquery_analysis_governance.md
        - skills/engineering/data_source_adapter_governance.md
        - skills/engineering/reproducibility_review.md
        - skills/engineering/logging_config_review.md
      codex_skills:
        - .codex/skills/pull-request-risk-review/SKILL.md
        - .codex/skills/pr-review-deep/SKILL.md
        - .codex/skills/quality-bar-gauntlet/SKILL.md
      rules:
        - rules/global/global_rules.yaml
        - rules/engineering/engineering_rules.yaml
      rubrics:
        - rubrics/code_quality_rubric.yaml
        - rubrics/mlops_readiness_rubric.yaml
      templates:
        - templates/pr_review_comment_template.md
        - templates/code_review_report_template.md
      output_modes:
        - pr_risk_review
        - merge_gate_assessment
        - pull_request_comments
        - changes_required_summary
      quality_gate:
        - full_diff_is_inspected
        - required_checks_are_complete_and_passed_or_gap_is_blocking
        - risk_dimensions_are_scored_with_evidence
        - hard_stops_override_numeric_score
        - flake8_pylint_mypy_mccabe_coverage_vulture_are_reported_for_python_prs
        - auto_approve_allowed_is_false_in_v1

    quality_gauntlet_agent:
      description: "Runs benchmark-driven quality loops using a named reference, separate builder/critic contexts, and evidence-backed pass/fail decisions."
      persona:
        - quality_bar_lead
        - evaluator_optimizer_controller
        - evidence_governance_reviewer
      skills:
        - skills/engineering/quality_bar_gauntlet.md
        - skills/transversal/evidence_framing.md
        - skills/engineering/reproducibility_review.md
        - skills/writing/plain_language_rewrite.md
      codex_skills:
        - .codex/skills/quality-bar-gauntlet/SKILL.md
        - .codex/skills/docs-alignment/SKILL.md
        - .codex/skills/document-control/SKILL.md
        - .codex/skills/testing-coverage/SKILL.md
        - .codex/skills/evidence-first-plot-analysis/SKILL.md
      rules:
        - rules/global/global_rules.yaml
        - rules/governance/governance_rules.yaml
        - rules/writing/writing_rules.yaml
      rubrics:
        - rubrics/documentation_quality_rubric.yaml
        - rubrics/code_quality_rubric.yaml
        - rubrics/presentation_quality_rubric.yaml
      templates:
        - templates/quality_bar_contract.yaml
        - templates/technical_appendix_template.md
        - templates/code_review_report_template.md
        - templates/technical_deck_outline_template.md
      output_modes:
        - quality_bar_contract
        - gauntlet_prompt
        - benchmark_comparison_report
        - critic_findings
        - pass_with_evidence_summary
      quality_gate:
        - reference_bar_is_named_fetchable_and_comparable
        - builder_and_critic_are_separate_contexts
        - actual_artifact_is_inspected_not_described
        - exact_evidence_paths_commands_or_renders_are_reported
        - domain_agent_rules_are_loaded_before_evaluation
        - no_paid_api_or_external_publish_without_explicit_approval
        - result_uses_pass_warn_fail_or_blocked

    software_architect_agent:
      description: "Designs maintainable modular repository architecture before implementation starts."
      persona:
        - principal_software_architect
        - platform_architecture_reviewer
        - maintainability_governance_lead
      skills:
        - skills/engineering/repository_architecture_planning.md
        - skills/engineering/analytical_dashboard_architecture.md
        - skills/engineering/data_source_adapter_governance.md
