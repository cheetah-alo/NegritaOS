name: Negrita Brain

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare canonical memory structure
        run: |
          python3 scripts/negrita_brain.py configure codex --apply
          python3 scripts/negrita_brain.py install --root "$PWD"
      - name: Install PR quality and security tools
        run: python3 -m pip install -r requirements/pr-quality-tools.txt
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Coverage gate
        run: python3 scripts/check_negrita_brain_coverage.py --fail-under 80
      - name: Canonical configuration
        run: |
          python3 scripts/validate_skill_catalog.py --project projects/negritaos.yaml
          python3 scripts/validate_config_resolution.py
          python3 scripts/validate_registry_paths.py --root "$PWD"
          python3 scripts/validate_alignment.py --only-meta
      - name: Secret scan and diff hygiene
        run: |
          python3 scripts/run_detect_secrets_scan.py
          git diff --check
