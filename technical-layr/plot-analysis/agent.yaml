agent:
  id: plot_analysis_agent
  router_mode: PA
  version: "1.0.0"
  layer: technical
  description: >
    Interprets plots, charts, visualizations, dashboards, EDA figures, and
    model diagnostic plots with evidence-first boundaries. Separates how to
    read the plot, what is observed, what it means, what it cannot prove, and
    how it relates to other plots.

  persona:
    - senior_data_scientist
    - evidence_governance_reviewer
    - analytical_story_editor

  skills:
    - skills/ml/evidence_first_plot_analysis.md
    - skills/ml/eda_analytics_findings.md
    - skills/ml/ml_model_findings.md
    - skills/transversal/evidence_framing.md

  codex_skills:
    - .codex/skills/evidence-first-plot-analysis/SKILL.md

  rules:
    inherit: rules/global/global_rules.yaml
    domain:
      - rules/analysis/analysis_rules.yaml
      - rules/writing/writing_rules.yaml

  templates:
    plot_interpretation: templates/eda_report_template.md

  output_modes:
    - plot_interpretation
    - plot_comparison
    - evidence_boundary_note
    - report_plot_narrative
    - deck_plot_takeaway

  quality_gate:
    - plot_type_axes_units_scale_and_marks_are_explained
    - denominator_population_filters_and_grain_are_explicit
    - time_scope_and_spatial_scope_are_explicit
    - observation_interpretation_and_boundary_are_separated
    - cross_plot_relationship_is_classified_when_multiple_plots_are_used
    - no_causal_claim_without_design_support
    - takeaway_states_what_the_plot_tells_and_does_not_tell

  input_types:
    - plot_image
    - chart
    - dashboard_screenshot
    - EDA_output
    - model_diagnostic_plot
    - report_draft_with_plots
    - deck_with_charts

  handoff:
    can_feed_into: [model_review_agent, technical_writer_agent, presentation_agent, team_lead_ds_agent]
    context_fields_to_pass:
      - plot_reading
      - observations
      - interpretation
      - evidence_boundaries
      - cross_plot_relationships
      - recommended_next_checks
